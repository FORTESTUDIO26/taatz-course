# Keeps the course database (Supabase, free plan) active: free projects are paused after a week without activity.
# Every 3 days this runs a small read query that any visitor can make, using the public address and public key
# from docs/js/config.js. It writes nothing and reads no personal data.
# If the database does not respond, the run fails and GitHub sends an email to the repository owner.
name: keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days, 06:17 UTC (09:17 Israel time)
  workflow_dispatch: {}       # manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/js/config.js
          sparse-checkout-cone-mode: false
      - name: Query the database
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" docs/js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" docs/js/config.js)
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" -m 30 -H "apikey: $KEY" "$URL/rest/v1/cohorts?select=name&limit=1") || CODE=000
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "The database responded."; exit 0; fi
            sleep 60
          done
          echo "::error::The course database did not respond. It may be paused: sign in to supabase.com and choose Restore project."
          exit 1
